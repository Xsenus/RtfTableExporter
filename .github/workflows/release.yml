name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - linux-x64
          - linux-musl-x64
          - linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve Version
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          dotnet publish ./RtfTableExporter.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="${{ steps.version.outputs.version }}" \
            -p:GitHubRepository="${{ github.repository }}" \
            -p:RepositoryUrl="https://github.com/${{ github.repository }}" \
            -o "./artifacts/publish/${{ matrix.rid }}"

      - name: Package
        run: |
          package_dir="./artifacts/package/${{ matrix.rid }}"
          zip_path="./artifacts/package/RtfTableExporter-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip"

          rm -rf "$package_dir"
          mkdir -p "$package_dir/docs"
          cp -R "./artifacts/publish/${{ matrix.rid }}/." "$package_dir/"
          cp "./README.md" "$package_dir/"
          cp "./icon.png" "$package_dir/"
          cp "./icon.ico" "$package_dir/"
          cp "./docs/USAGE.md" "$package_dir/docs/"
          cp "./docs/RELEASE_OVERVIEW.md" "$package_dir/docs/"

          if [ -f "$package_dir/RtfTableExporter" ]; then
            chmod +x "$package_dir/RtfTableExporter"
          fi

          rm -f "$zip_path"
          (
            cd "$package_dir"
            zip -r "../$(basename "$zip_path")" .
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: ./artifacts/package/RtfTableExporter-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ./dist

      - name: Build Checksums
        run: |
          sha256sum ./dist/*.zip > ./dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="RtfTableExporter ${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./dist/* --clobber
          else
            gh release create "$tag" ./dist/* --title "$title" --notes-file ./.github/release-notes.md --latest
          fi
